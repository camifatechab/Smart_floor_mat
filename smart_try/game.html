<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap - Prebuilt Layout</title>

    <!-- Bootstrap -->
    <link href="css/bootstrap-5.3.8.css" rel="stylesheet"> 
   
  </head>
  <body>
	<nav class="navbar bg-dark navbar-dark text-light" style="height: 10vh;">
		<div class="d-flex">
			<div class="nav-item mx-2">
				sound
			</div>
			<div class="mx-2">
				test
			</div>
		</div>
		<div class="d-flex">
			<div class="nav-item mx-2">
				sound
			</div>
			<div class="mx-2">
				test
			</div>
		</div>
	</nav>
	<div class="container" style="height: 80vh; background-color: #E6FFFD">
<!--		animation asset-->

		
		
		<div class="row" style="height: 10%; background-color: #79B2E1;">
			<div class="col-3 text-center" style="position: relative;">
				<button id="btn1_1">1</button>
				<img id="img1" style="display: inline-block; position: absolute; left:25%; top: 100%; width:50%; visibility: hidden;" src="img/gogo.png" alt="">
			</div>
			<div class="col-3 text-center" style="position: relative;">
				<button id="btn1_2">2</button>
				<img id="img2" style="display: inline-block; position: absolute; left:25%; top: 100%; width:50%; visibility: hidden;" src="img/gogo.png" alt="">
			</div>
			<div class="col-3 text-center" style="position: relative;">
				<button id="btn1_3">3</button>
				<img id="img3" style="display: inline-block; position: absolute; left:25%; top: 100%; width:50%; visibility: hidden;" src="img/gogo.png" alt="">
			</div>
			<div class="col-3 text-center" style="position: relative;">
				<button id="btn1_4">4</button>
				<img id="img4" style="display: inline-block; position: absolute; left:25%; top: 100%; width:50%; visibility: hidden;" src="img/gogo.png" alt="">
			</div>
		</div>


		<div style="display: block; height: 80%;">
			
		</div>

		<div class="row" style="height: 10%; background-color: #79B2E1">
			<div id="area1" class="col-3 text-center">
				Floor mat 1
			</div>
			<div id="area2" class="col-3 text-center">
				Floor mat 2
			</div>
			<div id="area3" class="col-3 text-center">
				Floor mat 3
			</div>
			<div id="area4" class="col-3 text-center">
				Floor mat 4
			</div>
		</div>
	</div>

	<footer>
		<div class="d-flex flex-column justify-content-center text-center bg-black text-light" style="height: 10vh;">
		  <p class="m-0">Copyright &copy; 2025 JumpNRun All Rights Reserved</p>
		</div>
	</footer>
	  
	  
	  
    <!-- Include all compiled plugins (below), or include individual files as needed --> 
    <script src="js/popper-2.11.8.min.js"></script>
  	<script src="js/bootstrap-5.3.8.js"></script>
	  
	<script>
		var distance = 64;
		var speed = 2000;
		var ty = 'translateY(' + distance + 'vh)';
		var img1 = document.getElementById("img1");
		var Anim1 = new KeyframeEffect(
			img1,
			[
				{transform: 'translateY(0px)'},
				{transform: ty}
			], {
				duration: speed,
				direction: 'alternate'
				});
		var img1Anim = new Animation(Anim1);
		img1Anim.pause();
		img1Anim.onfinish = () => {
			img1.style.visibility = "hidden";	
		}
		

		var Anim2 = new KeyframeEffect(
			img2,
			[
				{transform: 'translateY(0px)'},
				{transform: ty}
			], {
				duration: speed,
				direction: 'alternate'
				});
		var img2Anim = new Animation(Anim2);
		img2Anim.pause();
		img2Anim.onfinish = () => {
			img2.style.visibility = "hidden";	
		}
		

		var Anim3 = new KeyframeEffect(
			img3,
			[
				{transform: 'translateY(0px)'},
				{transform: ty}
			], {
				duration: speed,
				direction: 'alternate'
				});
		var img3Anim = new Animation(Anim3);
		img3Anim.pause();
		img3Anim.onfinish = () => {
			img3.style.visibility = "hidden";	
		}
		

		var Anim4 = new KeyframeEffect(
			img4,
			[
				{transform: 'translateY(0px)'},
				{transform: ty}
			], {
				duration: speed,
				direction: 'alternate'
				});
		var img4Anim = new Animation(Anim4);
		img4Anim.pause();
		img4Anim.onfinish = () => {
			img4.style.visibility = "hidden";	
		}
		
		
		
		
		
		
		var btn1_1 = document
			.getElementById("btn1_1")
			.addEventListener("click", function () {
				console.log("1");
				img1.style.visibility = "visible";
				img1Anim.play();
			});
		var btn1_2 = document
			.getElementById("btn1_2")
			.addEventListener("click", function () {
				console.log("2");
				img2.style.visibility = "visible";
				img2Anim.play();
			});
		var btn1_3 = document
			.getElementById("btn1_3")
			.addEventListener("click", function () {
				console.log("3");
				img3.style.visibility = "visible";
				img3Anim.play();
			});
		var btn1_4 = document
			.getElementById("btn1_4")
			.addEventListener("click", function () {
				console.log("4");
				img4.style.visibility = "visible";
				img4Anim.play();
			});
		
		
		
		
		
		
		
		var area1 = document.getElementById("area1");
		var area2 = document.getElementById("area2");
		var area3 = document.getElementById("area3");
		var area4 = document.getElementById("area4");
		
		
		document.addEventListener("keydown", (e) => {
			console.log(`Key "${e.key}" pressed [event: keydown]`);

			if (e.key == 1){
				var img1Rect = img1.getBoundingClientRect();
	//				console.log({bottom: img1Rect.bottom});
				var area1Rect = area1.getBoundingClientRect();
	//				console.log({top: area1Rect.top});
				if (img1Rect.bottom >= area1Rect.top){
					//待處理 Pending: keydown need to be involve repeate and not repeat *because elder will keep stand on the floor mat for a few secs.; but hit can not be repeat! *because one obstacle attack one heart. 
					console.log("hit! 1");
					img1.style.visibility = "hidden";
				}
			}
			else if (e.key == 2){
				var img2Rect = img2.getBoundingClientRect();
				var area2Rect = area2.getBoundingClientRect();
				if (img2Rect.bottom >= area2Rect.top){
					console.log("hit! 2");
					img2.style.visibility = "hidden";
				}
			}
			else if (e.key == 3){
				var img3Rect = img3.getBoundingClientRect();
				var area3Rect = area3.getBoundingClientRect();
				if (img3Rect.bottom >= area3Rect.top){
					console.log("hit! 3");
					img3.style.visibility = "hidden";
				}
			}
			else if (e.key == 4){
				var img4Rect = img4.getBoundingClientRect();
				var area4Rect = area4.getBoundingClientRect();
				if (img4Rect.bottom >= area4Rect.top){
					console.log("hit! 4");
					img4.style.visibility = "hidden";
				}
			} 
		});
		
		
		
  	</script>
  </body>
</html>
